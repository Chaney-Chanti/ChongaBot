[project]
name = "chongabot"
version = "2.0.0.dev0"
description = "A nation-building game for Discord"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "discord.py>=2.6",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chongabot"]

[tool.ruff]
extend-exclude = ["chongabot/storage/migrations/versions"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# ×, ·, − and friends are deliberate in player-facing text
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["chongabot"]
plugins = ["pydantic.mypy"]

# discord.py's hybrid_command signature doesn't type-check under mypy (it does under
# pyright), so cogs skip arg-type checks. rules/ and services/ stay fully strict.
[[tool.mypy.overrides]]
module = "chongabot.cogs.*"
disable_error_code = ["arg-type"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
