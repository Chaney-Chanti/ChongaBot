# One research per resource per age, each +20% to that resource's production.
# Bonuses multiply, so researching an age's food topic stacks with older ones.

ancient:
  pastures:      { name: Pastures,      cost: { knowledge: 300 }, effects: [{ kind: rate_multiplier, resources: { food: 1.2 } }] }
  carpentry:     { name: Carpentry,     cost: { knowledge: 300 }, effects: [{ kind: rate_multiplier, resources: { timber: 1.2 } }] }
  metal_alloys:  { name: Metal Alloys,  cost: { knowledge: 300 }, effects: [{ kind: rate_multiplier, resources: { metal: 1.2 } }] }
  trading:       { name: Trading,       cost: { knowledge: 300 }, effects: [{ kind: rate_multiplier, resources: { wealth: 1.2 } }] }
  writing:       { name: Writing,       cost: { knowledge: 300 }, effects: [{ kind: rate_multiplier, resources: { knowledge: 1.2 } }] }

